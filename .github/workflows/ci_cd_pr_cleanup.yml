name: pull-request-cleanup
on:
  pull_request:
    types: [closed]

# Apply the principle of least privilege to state at job level the right
# permissions. More information about workflow permissions in the page
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#permissions
permissions: {}

jobs:

  delete-caches:
    name: "Delete the caches of the pull-request"
    runs-on: ubuntu-latest
    permissions:
      actions: write # Delete caches of the repository
    steps:
      - name: "Delete the caches created by the pull-request"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          gh cache list --ref "${PR_REF}" --limit 100 --json id --jq '.[].id' |
            xargs --no-run-if-empty -n1 gh cache delete
