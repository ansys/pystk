name: pull-request
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

env:
  ANSYS_STK: 'ansys-stk'
  DOCUMENTATION_CNAME: 'stk.docs.pyansys.com'
  LICENSE_SERVER_PORT: '1055'
  MAIN_PYTHON_VERSION: '3.13'
  MINIMUM_PYTHON_VERSION: '3.10'
  PYSTK_DIR: '/home/stk/pystk'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Apply the principle of least privilege to state at job level the right
# permissions. More information about workflow permissions in the page
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#permissions
permissions: {}

jobs:

  debug-container:
    name: "Doc build"
    runs-on: [self-hosted, pystk]
    container:
      image: localhost:5000/ansys/stk-13.0:dev-ubuntu22.04-python3.13
      env:
        ANSYSLMD_LICENSE_FILE: '1055@${{ secrets.LICENSE_SERVER }}'
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: '/home/stk'
    steps:

      - name: "Checkout the project"
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          clean: true
          persist-credentials: false

      - name: "Move repository location"
        run: |
          mv ${GITHUB_WORKSPACE} /home/stk

      - name: "Build docs"
        run: |
          cd pystk && \
            python -m venv .venv && \
            source .venv/bin/activate && \
            python -m pip install tox && \
            tox -e doc-clean,doc-links,doc-html
