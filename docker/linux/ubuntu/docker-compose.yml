services:

  stk:
    image: ansys/stk-13.1:dev-ubuntu22.04
    container_name: stk
    build:
      context: ./stk-engine
      args:
        baseImage: ubuntu:22.04
    environment:
      - ANSYSLMD_LICENSE_FILE=$ANSYSLMD_LICENSE_FILE

  stk-pybase:
    image: ansys/stk-13.1:dev-ubuntu22.04-pybase
    depends_on:
      - stk
    container_name: stk-pybase
    build:
      context: ./stk-engine-pybase
      args:
        baseImage: ansys/stk-13.1:dev-ubuntu22.04
      additional_contexts:
        "ansys/stk-13.1:dev-ubuntu22.04": "service:stk"
    environment:
      - ANSYSLMD_LICENSE_FILE=$ANSYSLMD_LICENSE_FILE

  stk-python3.10:
    image: ansys/stk-13.1:dev-ubuntu22.04-python3.10
    depends_on:
      - stk-pybase
    container_name: stk-python3.10
    build:
      context: ./stk-engine-py310
      args:
        baseImage: ansys/stk-13.1:dev-ubuntu22.04
        basePythonImage: ansys/stk-13.1:dev-ubuntu22.04-pybase
      additional_contexts:
        "ansys/stk-13.1:dev-ubuntu22.04": "service:stk"
        "ansys/stk-13.1:dev-ubuntu22.04-pybase": "service:stk-pybase"
    environment:
      - ANSYSLMD_LICENSE_FILE=$ANSYSLMD_LICENSE_FILE

  stk-python3.11:
    image: ansys/stk-13.1:dev-ubuntu22.04-python3.11
    depends_on:
      - stk-pybase
    container_name: stk-python3.11
    build:
      context: ./stk-engine-py311
      args:
        baseImage: ansys/stk-13.1:dev-ubuntu22.04
        basePythonImage: ansys/stk-13.1:dev-ubuntu22.04-pybase
      additional_contexts:
        "ansys/stk-13.1:dev-ubuntu22.04": "service:stk"
        "ansys/stk-13.1:dev-ubuntu22.04-pybase": "service:stk-pybase"
    environment:
      - ANSYSLMD_LICENSE_FILE=$ANSYSLMD_LICENSE_FILE

  stk-python3.12:
    image: ansys/stk-13.1:dev-ubuntu22.04-python3.12
    depends_on:
      - stk-pybase
    container_name: stk-python3.12
    build:
      context: ./stk-engine-py312
      args:
        baseImage: ansys/stk-13.1:dev-ubuntu22.04
        basePythonImage: ansys/stk-13.1:dev-ubuntu22.04-pybase
      additional_contexts:
        "ansys/stk-13.1:dev-ubuntu22.04": "service:stk"
        "ansys/stk-13.1:dev-ubuntu22.04-pybase": "service:stk-pybase"
    environment:
      - ANSYSLMD_LICENSE_FILE=$ANSYSLMD_LICENSE_FILE

  stk-python3.13:
    image: ansys/stk-13.1:dev-ubuntu22.04-python3.13
    depends_on:
      - stk-pybase
    container_name: stk-python3.13
    build:
      context: ./stk-engine-py313
      args:
        baseImage: ansys/stk-13.1:dev-ubuntu22.04
        basePythonImage: ansys/stk-13.1:dev-ubuntu22.04-pybase
      additional_contexts:
        "ansys/stk-13.1:dev-ubuntu22.04": "service:stk"
        "ansys/stk-13.1:dev-ubuntu22.04-pybase": "service:stk-pybase"
    environment:
      - ANSYSLMD_LICENSE_FILE=$ANSYSLMD_LICENSE_FILE
