services:
  stk-python3.14:
    image: ansys/stk-13.1:dev-windowsservercore-ltsc2019-python3.14
    container_name: stk-python3.14
    build:
      context: .
      args:
        baseImage: ansys/stk-13.1:dev-windowsservercore-ltsc2019
        basePythonImage: ansys/stk-13.1:dev-windowsservercore-ltsc2019-pybase
    environment:
      - ANSYSLMD_LICENSE_FILE=$ANSYSLMD_LICENSE_FILE
